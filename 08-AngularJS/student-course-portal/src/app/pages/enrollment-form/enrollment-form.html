<h2>Student Enrollment Request</h2>

<form
  #enrollForm="ngForm"
  (ngSubmit)="onSubmit(enrollForm)">

  <!-- Student Name -->
  <div>

    <label>Student Name</label>

    <input
      type="text"
      name="studentName"
      [(ngModel)]="studentName"
      required
      minlength="3"
      #nameCtrl="ngModel">

    <div *ngIf="nameCtrl.touched">

      <small
        *ngIf="nameCtrl.errors?.['required']"
        class="error">

        Name is required

      </small>

      <small
        *ngIf="nameCtrl.errors?.['minlength']"
        class="error">

        Name must be at least 3 characters

      </small>

    </div>

  </div>

  <br>

  <!-- Student Email -->

  <div>

    <label>Email</label>

    <input
      type="email"
      name="studentEmail"
      [(ngModel)]="studentEmail"
      required
      email
      #emailCtrl="ngModel">

    <div *ngIf="emailCtrl.touched">

      <small
        *ngIf="emailCtrl.errors?.['required']"
        class="error">

        Email is required

      </small>

      <small
        *ngIf="emailCtrl.errors?.['email']"
        class="error">

        Invalid email format

      </small>

    </div>

  </div>

  <br>

  <!-- Course ID -->

  <div>

    <label>Course ID</label>

    <input
      type="number"
      name="courseId"
      [(ngModel)]="courseId"
      required
      #courseCtrl="ngModel">

    <div *ngIf="courseCtrl.touched">

      <small
        *ngIf="courseCtrl.errors?.['required']"
        class="error">

        Course ID is required

      </small>

    </div>

  </div>

  <br>

  <!-- Preferred Semester -->

  <div>

    <label>Preferred Semester</label>

    <select
      name="preferredSemester"
      [(ngModel)]="preferredSemester">

      <option value="Odd">Odd</option>

      <option value="Even">Even</option>

    </select>

  </div>

  <br>

  <!-- Terms -->

  <div>

    <label>

      <input
        type="checkbox"
        name="agreeToTerms"
        [(ngModel)]="agreeToTerms"
        required
        #termsCtrl="ngModel">

      I agree to the Terms and Conditions

    </label>

    <div *ngIf="termsCtrl.touched">

      <small
        *ngIf="termsCtrl.errors?.['required']"
        class="error">

        Please accept the terms

      </small>

    </div>

  </div>

  <br>

  <button
    type="submit"
    [disabled]="enrollForm.invalid">

    Submit

  </button>

  <button
    type="button"
    (click)="enrollForm.resetForm()">

    Reset

  </button>

</form>

<br>

<div
  *ngIf="submitted"
  class="success">

  Enrollment request submitted successfully!

</div>
